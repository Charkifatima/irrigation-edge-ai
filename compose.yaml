x-runtime: &runtime
  build:
    context: .
  image: irrigation-edge-ai:dev
  # Python est lancé directement : pas de binaire docker-init injecté.
  init: false
  mem_limit: 256m
  cpus: 1.0
  pids_limit: 64
  read_only: True
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  dev:
    <<: *runtime
    # Les modifications faites sur le PC sont visibles sans reconstruire l'image.
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./database:/app/database
      - ./alembic.ini:/app/alembic.ini
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-irrigation_db}
      POSTGRES_USER: ${POSTGRES_USER:-irrigation_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "irrigation_edge_ai"]

  edge-sim:
    <<: *runtime
    profiles: ["simulation"]
    command: ["python", "-m", "irrigation_edge_ai.simulator", "--count", "20", "--seed", "42", "--interval", "1"]
  kafka:
    image: apache/kafka:3.9.1
    container_name: irrigation-kafka
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: irrigation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-irrigation_db}
      POSTGRES_USER: ${POSTGRES_USER:-irrigation_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-irrigation_user} -d ${POSTGRES_DB:-irrigation_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  kafka_data:


  