x-runtime: &runtime
  build:
    context: .
  image: irrigation-edge-ai:dev
  # Python est lancé directement : pas de binaire docker-init injecté.
  init: false
  mem_limit: 256m
  cpus: 1.0
  pids_limit: 64
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  dev:
    <<: *runtime
    # Les modifications faites sur le PC sont visibles sans reconstruire l'image.
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    command: ["python", "-m", "irrigation_edge_ai"]

  edge-sim:
    <<: *runtime
    profiles: ["simulation"]
    command: ["python", "-m", "irrigation_edge_ai.simulator", "--count", "20", "--seed", "42", "--interval", "1"]
